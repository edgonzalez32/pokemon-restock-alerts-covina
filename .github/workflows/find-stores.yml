name: Find nearby Targets

on:
  push:
    paths: [config.json, find_stores.py]
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - run: python find_stores.py
